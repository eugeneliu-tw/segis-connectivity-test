            {"category": "環保", "name": "114年行政區垃圾處理概況統計_縣市", "code": "6MVz/3SOIe/HDUiMpsPwcw==", "sttime": "114Y", "stunit": "U01CO", "boundary": "全國"},
            {"category": "環保", "name": "113年行政區環境汙染源概況統計_縣市", "code": "Q0iASIA1p9l67hS7vqVk7w==", "sttime": "113Y", "stunit": "U01CO", "boundary": "全國"}
          ]
          CONFIG_EOF

      - name: Run batch download
        run: python3 segis_downloader.py segis_datasets.json

      - name: Upload results as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: segis-batch-results
          path: segis_downloads/
          if-no-files-found: warn
