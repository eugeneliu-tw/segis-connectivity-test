name: Batch Download SEGIS Datasets

on:
  workflow_dispatch:

jobs:
  batch-test:
    runs-on: ubuntu-latest
    steps:
      - name: Write downloader script
        run: |
          cat > segis_downloader.py << 'DOWNLOADER_EOF'
          import json, sys, io, zipfile, urllib.parse, urllib.request, ssl
          from pathlib import Path

          BASE_URL = "https://segis.moi.gov.tw/STATCloud/reqcontroller.file"
          OUT_DIR = Path("segis_downloads")

          def build_url(code, sttime, stunit, boundary, sub_boundary=""):
              params = {
                  "method": "filedown.downloadproductfile",
                  "code": code,
                  "STTIME": sttime,
                  "STUNIT": stunit,
                  "BOUNDARY": boundary,
              }
              if sub_boundary:
                  params["SUB_BOUNDARY"] = sub_boundary
              return f"{BASE_URL}?{urllib.parse.urlencode(params)}"

          def download_one(entry):
              name = entry["name"]
              category = entry.get("category", "misc")
              url = build_url(entry["code"], entry.get("sttime",""), entry.get("stunit","U01CO"), entry.get("boundary","全國"), entry.get("sub_boundary",""))
              req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0 (compatible; segis-downloader/1.0)"})
              try:
                  ctx = ssl.create_default_context()
                  with urllib.request.urlopen(req, timeout=30, context=ctx) as resp:
                      raw = resp.read()
                      status = resp.status
              except Exception as e:
                  return {"name": name, "category": category, "ok": False, "error": str(e), "url": url}
              if not raw.startswith(b"PK"):
                  return {"name": name, "category": category, "ok": False, "error": f"HTTP {status} not zip: {raw[:120]!r}", "url": url}
              out_dir = OUT_DIR / category
              out_dir.mkdir(parents=True, exist_ok=True)
              csv_saved = []
              has_miaoli = False
              preview_lines = []
              try:
                  with zipfile.ZipFile(io.BytesIO(raw)) as zf:
                      for zi in zf.infolist():
                          if zi.filename.lower().endswith(".csv"):
                              data = zf.read(zi)
                              dest = out_dir / f"{name}.csv"
                              dest.write_bytes(data)
                              csv_saved.append(str(dest))
                              if "苗栗縣".encode("utf-8-sig") in data or "苗栗縣".encode("utf-8") in data:
                                  has_miaoli = True
                              try:
                                  text = data.decode("utf-8-sig", errors="replace")
                                  preview_lines = text.splitlines()[:8]
                              except Exception:
                                  pass
              except zipfile.BadZipFile as e:
                  return {"name": name, "category": category, "ok": False, "error": f"bad zip: {e}", "url": url}
              if not csv_saved:
                  return {"name": name, "category": category, "ok": False, "error": "no csv in zip", "url": url}
              return {"name": name, "category": category, "ok": True, "saved": csv_saved, "has_miaoli": has_miaoli, "size_bytes": len(raw), "preview": preview_lines}

          def main():
              entries = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
              results = []
              for entry in entries:
                  r = download_one(entry)
                  results.append(r)
                  status = "OK" if r["ok"] else "FAIL"
                  miaoli = r.get("has_miaoli", "?")
                  print(f"[{status}] {r['category']}/{r['name']}  miaoli={miaoli}  {'' if r['ok'] else r.get('error')}")
                  if r.get("preview"):
                      print("  --- CSV preview (first 8 lines) ---")
                      for line in r["preview"]:
                          print("  " + line)
                      print("  ------------------------------------")
              ok = sum(1 for r in results if r["ok"])
              miaoli_ok = sum(1 for r in results if r.get("has_miaoli"))
              print(f"\n總結：{ok}/{len(results)} 下載成功，{miaoli_ok}/{len(results)} 含苗栗縣資料")
              OUT_DIR.mkdir(parents=True, exist_ok=True)
              (OUT_DIR / "_report.json").write_text(json.dumps(results, ensure_ascii=False, indent=2), encoding="utf-8")

          if __name__ == "__main__":
              main()
          DOWNLOADER_EOF

      - name: Write dataset config
        run: |
          cat > segis_datasets.json << 'CONFIG_EOF'
          [
            {"category": "人口特性", "name": "114年12月行政區人口統計_鄉鎮市區_苗栗縣", "code": "JQLKJdMPLbtH75bn0vgGBg==", "sttime": "114Y12M", "stunit": "U01TO", "boundary": "全國", "sub_boundary": "苗栗縣"},
            {"category": "人口特性", "name": "114年12月行政區人口指標_鄉鎮市區_苗栗縣", "code": "OG1r+fIvJj2S773GC6Qk1w==", "sttime": "114Y12M", "stunit": "U01TO", "boundary": "全國", "sub_boundary": "苗栗縣"},
            {"category": "教育設施", "name": "114學年全國行政區國民小學統計_鄉鎮市區_苗栗縣", "code": "P8zewO50eTqbl9QuQ8zsGw==", "sttime": "114Y", "stunit": "U01TO", "boundary": "全國", "sub_boundary": "苗栗縣"},
            {"category": "教育設施", "name": "114學年全國行政區國民中學統計_鄉鎮市區_苗栗縣", "code": "4MicHceRLBWUBNRcNH1gow==", "sttime": "114Y", "stunit": "U01TO", "boundary": "全國", "sub_boundary": "苗栗縣"},
            {"category": "教育設施", "name": "114學年全國行政區高級中等學校統計_鄉鎮市區_苗栗縣", "code": "u3aD/knf/dc9s/9cmqyzpw==", "sttime": "114Y", "stunit": "U01TO", "boundary": "全國", "sub_boundary": "苗栗縣"},
            {"category": "教育設施", "name": "114學年全國行政區大專校院統計_鄉鎮市區_苗栗縣", "code": "ZHQYJvDQVi+6znxQmYDlnA==", "sttime": "114Y", "stunit": "U01TO", "boundary": "全國", "sub_boundary": "苗栗縣"},
            {"category": "醫療資源", "name": "114年12月行政區醫療院所統計_鄉鎮市區_苗栗縣", "code": "t8GT1x+Z4+IfdY+naSvZuQ==", "sttime": "114Y12M", "stunit": "U01TO", "boundary": "全國", "sub_boundary": "苗栗縣"},
            {"category": "醫療資源", "name": "114年12月行政區護產機構統計_鄉鎮市區_苗栗縣", "code": "nW05zjXymDgWCFC6p/Q4nw==", "sttime": "114Y12M", "stunit": "U01TO", "boundary": "全國", "sub_boundary": "苗栗縣"}
          ]
          CONFIG_EOF

      - name: Run batch download
        run: python3 segis_downloader.py segis_datasets.json

      - name: Upload results as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: segis-batch-results
          path: segis_downloads/
          if-no-files-found: warn
